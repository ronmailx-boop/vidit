# TEMPORARY diagnostic – removed before merge.
name: tmp download test
on:
  push:
    branches: [ccr-36db6e32-rixxiw]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Download mako stream as MP4
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          (PORT=3000 node server.js &) ; until curl -s localhost:3000/health >/dev/null; do sleep 1; done
          U=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "https://mako-vod.akamaized.net/i/SHORT/CH22_NEWS/2025/07/19yad2_vtr2_n20250724_v1/19yad2_vtr2_n20250724_v1_,850,.mp4.csmil/master.m3u8")
          R=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "https://www.mako.co.il/news-money/consumer/Article-690e882977d3891027.htm")
          time curl -s -D h.txt -o out.mp4 "localhost:3000/api/download?url=$U&name=%D7%99%D7%93%202&ref=$R"
          tr -d '\r' < h.txt | grep -iE "^(HTTP|content-type|content-disposition)"
          ls -l out.mp4
          ffprobe -v error -show_entries format=format_name,duration:stream=codec_type,codec_name,width,height -of compact out.mp4
          ffmpeg -v error -i out.mp4 -f null - && echo "DECODE OK"
