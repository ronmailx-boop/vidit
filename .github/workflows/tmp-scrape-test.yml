name: tmp scrape test
on:
  push:
    branches: [ccr-36db6e32-rixxiw]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: VAST playlist follow
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          PAGE="https://www.mako.co.il/news-money/consumer/Article-690e882977d3891027.htm"
          enc() { node -e 'console.log(encodeURIComponent(process.argv[1]))' "$1"; }
          CP=$(enc "LEVEL4=News_money_consumer&MAKOPAGE=690e882977d38910VgnVCM100000700a10acRCRD")
          IU="/242748299/mako/news/News_money/"
          U="https://pubads.g.doubleclick.net/gampad/ads?slotname=$(enc $IU)&sz=4x4&ciu_szs=&url=$(enc $PAGE)&unviewed_position_start=1&output=xml_vast2&env=vp&gdfp_req=1&vid=1&cust_params=$CP&cmsid=4099&correlator=$RANDOM$RANDOM"
          curl -s -A "$UA" -H "Referer: $PAGE" "$U" > pl.xml
          cat pl.xml | sed 's/useragent=[^&]*//g' | cut -c1-400
          echo; echo ======= FOLLOW
          grep -oE '<!\[CDATA\[[^]]+' pl.xml | sed 's/<!\[CDATA\[//' | while read -r A; do
            B=$(curl -s -A "$UA" -H "Referer: $PAGE" "$A")
            echo "-- bytes=${#B} ads=$(echo "$B" | grep -o '<Ad ' | wc -l) media=$(echo "$B" | grep -o '<MediaFile' | wc -l) wrap=$(echo "$B" | grep -o 'VASTAdTagURI' | wc -l)"
            echo "$B" | tr '\n' ' ' | grep -oE '<(AdTitle|Duration|VASTAdTagURI)>[^/]{0,300}' | head -6
            echo "$B" | tr '\n' ' ' | grep -oE '<MediaFile[^>]*>\s*<!\[CDATA\[[^]]*' | head -4
          done
