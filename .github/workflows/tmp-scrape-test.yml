# TEMPORARY diagnostic – removed before merge.
name: tmp scrape test
on:
  push:
    branches: [ccr-36db6e32-rixxiw]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scrape mako
        env:
          TARGET: https://www.mako.co.il/news-money/consumer/Article-690e882977d3891027.htm
        run: |
          node -e '
            const { scrape } = require("./server.js");
            (async () => {
              const r = await scrape(process.env.TARGET, { depth: 1 });
              console.log("TITLE", r.title, "| ads", r.adsCount, "| notes", JSON.stringify(r.notes));
              for (const x of r.results) console.log("RES", x.kind, x.role, x.adIndex || "", x.positionLabel || "", x.duration || "", x.source, x.url.slice(0, 160));
              for (const t of r.adTags) console.log("ADTAG", t.label, t.url.slice(0, 200));
              require("fs").writeFileSync("tag.txt", (r.adTags[0] || {}).url || "");
            })().catch(e => { console.error(e); process.exit(1); });
          '
      - name: CORS of ad request from the UI origin
        run: |
          T=$(cat tag.txt); [ -n "$T" ] || exit 0
          curl -s -D - -o /dev/null -H "Origin: https://vidit.vplusstudio.app" -A "Mozilla/5.0 (Linux; Android 14) Chrome/124.0 Mobile" "$T" | grep -iE "^(HTTP|access-control|content-type)"
